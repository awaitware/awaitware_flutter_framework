name: awaitware_flutter_framework
description: "A Tailwind CSS-inspired chainable extension-method toolkit for Flutter, covering every Tailwind utility category."
# Remove this line (and fill in homepage/repository below) before running
# `dart pub publish` for real — left in so this package can't be published
# by accident.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
